name: Delegate to coding agent
description: Define a bounded task that may be suitable for a coding agent.
title: "[Agent] <one-line summary>"
labels:
  - coding-agent
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        ## Write a bounded task

        Describe the outcome, acceptance criteria, relevant paths, and explicit
        exclusions. Repository-native instructions apply where present. This
        form identifies a task that may be suitable for a coding agent; it does
        not assume identical agent features or workflows in every repository.

  - type: input
    id: goal
    attributes:
      label: Goal (one line)
      description: State the bounded outcome to produce.
      placeholder: "Clarify the generated-file guidance in the contributor documentation."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable outcomes without prescribing an unnecessary implementation plan.
      placeholder: |
        - [ ] The maintained source clearly identifies the generated output.
        - [ ] Existing behavior and unrelated wording remain unchanged.
    validations:
      required: true

  - type: textarea
    id: relevant-paths
    attributes:
      label: Relevant paths
      description: Point to the files or directories most likely to matter.
      placeholder: |
        - `README.md`
        - `scripts/example.py`
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what must not be changed or attempted.
      placeholder: |
        - Do not modify generated files.
        - Do not change unrelated templates or workflows.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Background and context
      description: Link related issues, files, designs, screenshots, or prior decisions.
      placeholder: |
        - Related issue or PR:
        - Existing guidance:

  - type: textarea
    id: validation
    attributes:
      label: Validation expectations
      description: Name the smallest relevant checks, or describe the expected manual validation.
      placeholder: |
        - Run the repository's targeted check for the changed file type.
        - Verify changed links or rendered template structure.
    validations:
      required: true
