name: Feature request
description: A new capability or improvement.
title: "[Feature] <short summary>"
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do you want? Why?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How might it work? Describe the shape at a high level without requiring a specific implementation.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about? Why not those?

  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: Things this issue is not asking for.

  - type: markdown
    attributes:
      value: |
        ---
        If this is ready as a bounded implementation task, use the
        **Delegate to coding agent** form to capture acceptance criteria,
        relevant paths, exclusions, and targeted validation.
