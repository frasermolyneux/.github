name: Bug report
description: Something is wrong with an existing capability.
title: "[Bug] <short summary>"
labels:
  - bug
  - needs-triage
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line — what's wrong?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include the affected version, platform, branch, commit, or other relevant context.
      placeholder: |
        - Version or commit:
        - Platform or environment:
        - Other relevant configuration:

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Add relevant logs, error output, screenshots, or recordings. Remove secrets and sensitive data first.
